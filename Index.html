<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Don Chat 👑</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Segoe UI',Arial;background:#0f0f0f;color:#fff;display:flex;height:100vh}
#sidebar{width:280px;background:#1a1a1a;border-right:1px solid #333;display:flex;flex-direction:column}
#main{flex:1;display:flex;flex-direction:column;background:#1e1e1e}
#chat-box{flex:1;padding:15px;overflow-y:auto;background:#121212}
input,button,select{padding:10px;margin:5px;border:none;border-radius:8px;font-size:14px}
button{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#000;font-weight:600;cursor:pointer;transition:0.2s}
button:hover{transform:scale(1.03)}
.user,.req{padding:10px;margin:6px 0;background:#2a2a2a;border-radius:8px;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.user:hover{background:#333}
#call-box{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#000;padding:20px;border:2px solid gold;border-radius:12px;z-index:100}
video{width:240px;height:180px;background:#000;border-radius:8px;margin:5px}
.msg{margin:8px 0;padding:10px 14px;background:#2a2a2a;border-radius:10px;max-width:70%;word-wrap:break-word}
.msg.me{background:linear-gradient(135deg,#ffd700,#ffaa00);color:#000;margin-left:auto}
.emoji-bar{display:flex;gap:5px;flex-wrap:wrap;margin:5px 0}
.emoji-btn{font-size:22px;padding:5px;background:#333;border-radius:6px;cursor:pointer}
.emoji-btn:hover{background:#444}
.topbar{padding:12px;background:#1a1a1a;border-bottom:1px solid #333;display:flex;justify-content:space-between;align-items:center}
#emojiPicker{display:none;position:absolute;bottom:60px;background:#222;padding:10px;border-radius:10px;border:1px solid #444}
.req-btn{padding:4px 10px;font-size:12px;margin-left:4px}
</style>
</head>
<body>

<div id="sidebar">
  <div class="topbar"><b>👑 Don Chat</b></div>

  <div id="authBox" style="padding:10px">
    <input id="email" placeholder="Email" type="email">
    <input id="pass" placeholder="Password" type="password">
    <button onclick="signup()">Signup</button>
    <button onclick="login()">Login</button>
  </div>

  <div id="appBox" style="display:none;padding:10px">
    <h4>Rooms 🏠</h4>
    <select id="room" onchange="switchRoom()">
      <option value="general">General 🔥</option>
      <option value="gaming">Gaming 🎮</option>
      <option value="music">Music 🎵</option>
    </select>

    <h4>Users 👥</h4>
    <div id="users"></div>

    <h4>Friend Requests 📨</h4>
    <div id="requests"></div>
  </div>
</div>

<div id="main">
  <div class="topbar">
    <span id="room-title">General 🔥</span>
    <span id="userEmail"></span>
  </div>

  <div id="chat-box"></div>

  <div style="padding:10px;background:#1a1a1a;position:relative">
    <div id="emojiPicker"></div>
    <div class="emoji-bar">
      <button class="emoji-btn" onclick="toggleEmoji()">😊</button>
      <button class="emoji-btn" onclick="addEmoji('😂')">😂</button>
      <button class="emoji-btn" onclick="addEmoji('🔥')">🔥</button>
      <button class="emoji-btn" onclick="addEmoji('👑')">👑</button>
      <button class="emoji-btn" onclick="addEmoji('❤️')">❤️</button>
    </div>
    <input id="msg" placeholder="Message likho..." style="width:70%;">
    <button onclick="sendMsg()">Send</button>
    <button onclick="startVoice()">🎤</button>
    <button onclick="startCall('video')">📹</button>
    <button onclick="startCall('audio')">📞</button>
  </div>
</div>

<div id="call-box">
  <h3 id="call-status">Calling...</h3>
  <video id="myVideo" autoplay muted></video>
  <video id="theirVideo" autoplay></video>
  <br>
  <button onclick="endCall()">End Call</button>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>
// DON KA FIREBASE CONFIG = APNA YAHAN DAL
const firebaseConfig = {
  apiKey:"AIzaSyC1Pz7uoJVWJHEBAfdeyafnX8PrfnjPx18",
    authDomain: "don-chat-31494.firebaseapp.com",
    projectId: "don-chat-31494",
    storageBucket: "don-chat-31494.firebasestorage.app",
    messagingSenderId: "1064715682727",
    appId: "1:1064715682727:web:c42256a0c659ee2909ac82",
    measurementId: "G-26BJ3K9EF3"
  };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.database();

let currentUser = null;
let currentRoom = "general";
let currentDM = null;
let peerConnection = null;

// EMOJI PICKER
const emojis = ["😂","🔥","👑","❤️","😍","😎","🤔","😭","😡","🙏","💯","🎉"];
function toggleEmoji(){
  emojiPicker.style.display = emojiPicker.style.display=="block"?"none":"block";
  emojiPicker.innerHTML = emojis.map(e=>`<span class="emoji-btn" onclick="addEmoji('${e}')">${e}</span>`).join('');
}
function addEmoji(e){ msg.value += e; }

// AUTH
function signup(){
  auth.createUserWithEmailAndPassword(email.value, pass.value)
   .then(()=>alert("Don, account ban gaya!"));
}
function login(){
  auth.signInWithEmailAndPassword(email.value, pass.value)
   .then(u=>{
      currentUser=u.user;
      authBox.style.display="none";
      appBox.style.display="block";
      userEmail.innerText = currentUser.email;
      loadUsers(); loadRequests(); loadChat();
    });
}
auth.onAuthStateChanged(u=>{
  if(u){ currentUser=u; login(); }
});

// ROOMS + CHAT
function switchRoom(){
  currentRoom = room.value;
  currentDM = null;
  roomTitle.innerText = currentRoom + " 🔥";
  loadChat();
}
function sendMsg(){
  if(!currentUser ||!msg.value.trim()) return;
  let path = currentDM? `dms/${getDMKey(currentUser.uid, currentDM)}` : `rooms/${currentRoom}`;
  db.ref(path).push({uid:currentUser.uid, email:currentUser.email, text:msg.value, time:Date.now()});
  msg.value="";
}
function getDMKey(a,b){ return a<b? a+"_"+b : b+"_"+a; }

// LOAD CHAT
function loadChat(){
  let path = currentDM? `dms/${getDMKey(currentUser.uid, currentDM)}` : `rooms/${currentRoom}`;
  db.ref(path).on("value", snap=>{
    chatBox.innerHTML="";
    snap.forEach(c=>{
      let d=c.val();
      let cls = d.uid==currentUser.uid? "msg me" : "msg";
      chatBox.innerHTML += `<div class="${cls}"><b>${d.email}</b><br>${d.text}</div>`;
    });
    chatBox.scrollTop=chatBox.scrollHeight;
  });
}

// USERS + FRIEND SYSTEM
function loadUsers(){
  db.ref("users").on("value", snap=>{
    users.innerHTML="";
    snap.forEach(u=>{
      if(u.key!=currentUser.uid){
        let status = u.val().online? "🟢" : "⚫";
        users.innerHTML+=`<div class="user" onclick="openDM('${u.key}')">${u.val().email} ${status}</div>`;
      }
    });
  });
  db.ref("users/"+currentUser.uid).set({email:currentUser.email, online:true});
  window.onbeforeunload = ()=>db.ref("users/"+currentUser.uid+"/online").set(false);
}
function openDM(uid){
  currentDM=uid; currentRoom=null;
  roomTitle.innerText="DM with "+uid;
  loadChat();
}

// FRIEND REQUEST ACCEPT/REJECT
function sendRequest(uid){
  db.ref(`requests/${uid}/${currentUser.uid}`).set({from:currentUser.email, status:"pending"});
  alert("Request bheji Don!");
}
function loadRequests(){
  db.ref(`requests/${currentUser.uid}`).on("value", snap=>{
    requests.innerHTML="";
    snap.forEach(r=>{
      let d=r.val();
      if(d.status=="pending"){
        requests.innerHTML+=`<div class="req">${d.from}
          <span><button class="req-btn" onclick="acceptReq('${r.key}')">Accept</button>
          <button class="req-btn" onclick="rejectReq('${r.key}')">Reject</button></span></div>`;
      }
    });
  });
}
function acceptReq(uid){
  db.ref(`friends/${currentUser.uid}/${uid}`).set(true);
  db.ref(`friends/${uid}/${currentUser.uid}`).set(true);
  db.ref(`requests/${currentUser.uid}/${uid}`).remove();
}
function rejectReq(uid){
  db.ref(`requests/${currentUser.uid}/${uid}`).remove();
}

// WEBRTC CALL
async function startCall(type){
  if(!currentDM) return alert("Pehle DM me jao Don!");
  callBox.style.display="block";
  let stream = await navigator.mediaDevices.getUserMedia({video:type=="video", audio:true});
  myVideo.srcObject=stream;

  peerConnection = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  stream.getTracks().forEach(t=>peerConnection.addTrack(t, stream));
  peerConnection.ontrack = e=>{ theirVideo.srcObject = e.streams[0]; };

  let offer = await peerConnection.createOffer();
  await peerConnection.setLocalDescription(offer);
  db.ref(`calls/${currentDM}`).push({offer});

  db.ref(`calls/${currentDM}`).on("child_added", snap=>{
    let data=snap.val();
    if(data.answer) peerConnection.setRemoteDescription(data.answer);
    if(data.candidate) peerConnection.addIceCandidate(data.candidate);
    if(data.offer) handleOffer(data.offer);
  });
}
async function handleOffer(offer){
  peerConnection = new RTCPeerConnection({iceServers:[{urls:"stun:stun.l.google.com:19302"}]});
  await peerConnection.setRemoteDescription(offer);
  let answer = await peerConnection.createAnswer();
  await peerConnection.setLocalDescription(answer);
  db.ref(`calls/${currentDM}`).push({answer});
}
function endCall(){
  callBox.style.display="none";
  if(peerConnection) peerConnection.close();
  db.ref(`calls/${currentDM}`).remove();
}

// VOICE MESSAGE
async function startVoice(){
  let rec = new MediaRecorder(await navigator.mediaDevices.getUserMedia({audio:true}));
  let chunks=[];
  rec.ondataavailable = e=>chunks.push(e.data);
  rec.onstop = ()=>{
    let blob=new Blob(chunks,{type:"audio/webm"});
    let url=URL.createObjectURL(blob);
    chatBox.innerHTML += `<div class="msg me"><b>Voice:</b> <audio controls src="${url}"></audio></div>`;
  };
  rec.start(); setTimeout(()=>rec.stop(),4000);
}
</script>
</body>
</html>
